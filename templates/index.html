<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocedor MNIST</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --border-color: #ced4da;
            --border-dark: #212529;
            --primary: #212529;
            --primary-hover: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
            text-align: center;
        }

        p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            font-size: 0.875rem;
            color: var(--text-muted);
            padding: 8px;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            margin-bottom: 1rem;
        }

        .preview-caja {
            width: 100%;
            height: 200px;
            border: 1px solid var(--border-color);
            background-color: #f1f3f5;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        #preview {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #textoPreview {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        button {
            background-color: var(--primary);
            color: #ffffff;
            border: 1px solid var(--border-dark);
            padding: 10px 16px;
            font-size: 0.875rem;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            border-color: var(--border-color);
            cursor: not-allowed;
        }

        #resultado {
            margin-top: 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            min-height: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Reconocedor de Números (IA)</h1>
        <p>Sube una imagen de un número escrito a mano (0-9).</p>

        <form id="formulario">
            <input type="file" id="inputImagen" accept="image/*" required>
            
            <div class="preview-caja">
                <img id="preview" style="display: none;" alt="Previsualización">
                <span id="textoPreview">Vista previa</span>
            </div>

            <button type="submit" id="btnEnviar">Analizar Imagen</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script>
        const inputImagen = document.getElementById('inputImagen');
        const preview = document.getElementById('preview');
        const textoPreview = document.getElementById('textoPreview');
        const formulario = document.getElementById('formulario');
        const btnEnviar = document.getElementById('btnEnviar');
        const divResultado = document.getElementById('resultado');

        inputImagen.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    textoPreview.style.display = 'none';
                    divResultado.innerHTML = '';
                }
                reader.readAsDataURL(file);
            }
        });

        formulario.addEventListener('submit', async function(e) {
            e.preventDefault();
            const file = inputImagen.files[0];
            if (!file) return;

            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Procesando...';
            divResultado.innerHTML = '';

            const formData = new FormData();
            formData.append('imagen', file);

            try {
                const response = await fetch('/predecir', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    divResultado.innerHTML = `Resultado: ${data.numero_predicho}<br><span style="color: var(--text-muted); font-size: 0.8rem; font-weight: normal;">Confianza: ${data.confianza}%</span>`;
                } else {
                    divResultado.innerHTML = `<span style="color: #c92a2a;">Error: ${data.error}</span>`;
                }
            } catch (error) {
                divResultado.innerHTML = `<span style="color: #c92a2a;">Error de conexión con el servidor.</span>`;
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.textContent = 'Analizar Imagen';
            }
        });
    </script>
</body>
</html>
